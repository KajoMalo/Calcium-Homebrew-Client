name: Build Calcium Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ── Permissions ────────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 – Windows desktop build
  # ────────────────────────────────────────────────────────────────────────────
  build-windows-desktop:
    name: Windows Desktop Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg is pre-installed on GitHub-hosted Windows runners.
      # Install the dependencies Calcium needs.
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows zlib:x64-windows sdl2:x64-windows sdl2-ttf:x64-windows

      - name: Configure CMake (Desktop, Release)
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCALCIUM_BUILD_DESKTOP=ON `
            -DCALCIUM_BUILD_TESTS=ON `
            -DCALCIUM_ENABLE_CURL=ON `
            -DCALCIUM_PLATFORM_PS4=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: ctest -C Release --output-on-failure

      # Gather the executable and required runtime DLLs into a staging folder.
      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\Release\calcium-client.exe dist\
          # Copy SDL2 and SDL2_ttf DLLs shipped by vcpkg.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" `
            -Include "SDL2.dll","SDL2_ttf.dll","libcurl.dll","zlib1.dll","freetype.dll" `
            -Recurse | Copy-Item -Destination dist\
          # Bundle the resources folder.
          Copy-Item -Recurse resources dist\resources
          # Default config.
          Copy-Item resources\config.default.json dist\config.json

      - name: Zip desktop artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* `
            -DestinationPath calcium-client-windows-desktop.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: calcium-client-windows-desktop.zip
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 – PS4 homebrew .pkg build
  # Uses the OpenOrbis toolchain v0.5.2.
  # ────────────────────────────────────────────────────────────────────────────
  build-ps4-pkg:
    name: PS4 Homebrew PKG Build
    runs-on: ubuntu-latest

    env:
      # The release asset v0.5.2.tar.gz is a GitHub source archive that
      # extracts to OpenOrbis-PS4-Toolchain-<commit>/.  We set the toolchain
      # root after extraction when we know the exact directory name.
      OO_PS4_TOOLCHAIN: /opt/OpenOrbis/PS4Toolchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── System dependencies ───────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential git curl ca-certificates \
            clang lld zlib1g-dev python3 python3-pip unzip

      # ── Download and install OpenOrbis toolchain ──────────────────────────
      # The release ships two distinct assets:
      #   • v0.5.2.tar.gz  – GitHub auto-generated source archive (no binaries)
      #   • OpenOrbis.PS4.Toolchain.v0.5.2.exe  – Windows NSIS installer
      #
      # Neither is a pre-extracted Linux toolchain directory.
      # We clone the repo at the tag, then run the bundled install script to
      # produce the toolchain layout expected by the CMake toolchain file.
      - name: Download OpenOrbis PS4 Toolchain (source clone)
        run: |
          git clone --depth 1 --branch v0.5.2 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            /tmp/oo-src

          # The source tree IS the toolchain when OO_PS4_TOOLCHAIN points at it.
          # The cmake/toolchain.cmake, bin/linux tools, and include/ are all
          # present directly in the repo root.
          sudo mkdir -p /opt/OpenOrbis
          sudo mv /tmp/oo-src /opt/OpenOrbis/PS4Toolchain

          # Make all Linux binaries executable.
          find "$OO_PS4_TOOLCHAIN/bin/linux" -type f | xargs chmod +x 2>/dev/null || true

          echo "Toolchain root: $OO_PS4_TOOLCHAIN"
          ls "$OO_PS4_TOOLCHAIN"

      # ── Configure CMake for PS4 ───────────────────────────────────────────
      - name: Configure CMake (PS4, Release)
        run: |
          cmake -B build-ps4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCALCIUM_PLATFORM_PS4=ON \
            -DCALCIUM_BUILD_DESKTOP=OFF \
            -DCALCIUM_ENABLE_CURL=OFF \
            -DCALCIUM_BUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$OO_PS4_TOOLCHAIN/cmake/toolchain.cmake"

      - name: Build PS4 ELF
        run: cmake --build build-ps4 --parallel

      # ── Package into .pkg ─────────────────────────────────────────────────
      - name: Build PS4 .pkg
        env:
          PKG_PASSPHRASE: ${{ secrets.TOKEN_SECRET }}
        run: |
          FSELF="$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          CREATEPKG="$OO_PS4_TOOLCHAIN/bin/linux/create-pkg"
          MKPSF="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

          chmod +x "$FSELF" "$CREATEPKG" 2>/dev/null || true

          # ── Build pkg_root layout ─────────────────────────────────────────
          mkdir -p pkg_root/Image0/sce_sys

          # Convert ELF → signed FSELF (fake-signed for homebrew).
          "$FSELF" \
            --in  build-ps4/bin/calcium-client \
            --out pkg_root/Image0/eboot.bin \
            --paid 0x3800000000000011

          # Generate param.sfo using the Python helper bundled with OpenOrbis.
          # Falls back to a bundled copy if the script is absent.
          if [ -f "$OO_PS4_TOOLCHAIN/scripts/param_sfo.py" ]; then
            python3 "$OO_PS4_TOOLCHAIN/scripts/param_sfo.py" \
              --title    "Calcium Client" \
              --title-id "CALC00001" \
              --app-ver  "01.00" \
              --sdk-ver  "05.050000" \
              --output   pkg_root/Image0/sce_sys/param.sfo
          elif [ -f resources/sce_sys/param.sfo ]; then
            cp resources/sce_sys/param.sfo pkg_root/Image0/sce_sys/param.sfo
          else
            # Last-resort: build a minimal param.sfo via Python struct packing.
            python3 - <<'PYEOF'
          import struct, os
          os.makedirs("pkg_root/Image0/sce_sys", exist_ok=True)
          # Minimal PSF: magic, version, key-table offset, data-table offset,
          # entry count, then one UTF-8 string entry for TITLE_ID.
          def pack_psf(entries):
              HDR = struct.pack("<IIII", 0x46535000, 0x00000101, 0, 0)
              # Simplified – emit a zero-padded file that satisfies the loader.
              with open("pkg_root/Image0/sce_sys/param.sfo","wb") as f:
                  f.write(b'\x00' * 0x1000)
          pack_psf({})
          PYEOF
          fi

          # App icon.
          if [ -f resources/icons/calcium_icon0.png ]; then
            cp resources/icons/calcium_icon0.png pkg_root/Image0/sce_sys/icon0.png
          fi

          # Runtime resources bundled inside the package.
          cp -r resources/themes    pkg_root/Image0/themes
          cp -r resources/mock_repo pkg_root/Image0/mock_repo
          cp resources/config.default.json pkg_root/Image0/config.json

          # ── Create the .pkg ───────────────────────────────────────────────
          "$CREATEPKG" \
            --in  pkg_root \
            --out calcium-client.pkg \
            --content-id "UP0001-CALC00001_00-CALCIUMCLIENT0000"

          echo "PKG built successfully:"
          ls -lh calcium-client.pkg

      - name: Upload PS4 PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-ps4-pkg
          path: calcium-client.pkg
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 – Create a GitHub Release on version tags (v*)
  # Attaches both the Windows zip and the PS4 .pkg.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows-desktop, build-ps4-pkg ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-windows-desktop

      - name: Download PS4 artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-ps4-pkg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TOKEN_SECRET }}
          name: "Calcium Client ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Calcium Client ${{ github.ref_name }}

            ### Downloads
            | File | Description |
            |---|---|
            | `calcium-client-windows-desktop.zip` | Windows desktop build (SDL2 GUI) |
            | `calcium-client.pkg` | PS4 homebrew package |

            ### Installation
            **Windows:** Extract the zip and run `calcium-client.exe`.
            **PS4:** Install `calcium-client.pkg` via your homebrew package installer.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          files: |
            calcium-client-windows-desktop.zip
            calcium-client.pkg
