name: Build Calcium Client

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write


# ============================================================
# Windows desktop build
# ============================================================

jobs:

  build-windows-desktop:
    name: Windows Desktop Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install `
            curl:x64-windows `
            zlib:x64-windows `
            sdl2:x64-windows `
            sdl2-ttf:x64-windows

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCALCIUM_BUILD_DESKTOP=ON `
            -DCALCIUM_BUILD_TESTS=ON `
            -DCALCIUM_ENABLE_CURL=ON `
            -DCALCIUM_PLATFORM_PS4=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          ctest --output-on-failure

      - name: Stage Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          if (Test-Path "build\bin\calcium-client.exe") {
            Copy-Item `
              "build\bin\calcium-client.exe" `
              "dist\calcium-client.exe"
          }
          elseif (Test-Path "build\bin\Release\calcium-client.exe") {
            Copy-Item `
              "build\bin\Release\calcium-client.exe" `
              "dist\calcium-client.exe"
          }
          else {
            Write-Error "calcium-client.exe was not produced."
            Get-ChildItem build -Recurse -Filter "*.exe"
            exit 1
          }

          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

          $dlls = @(
            "SDL2.dll",
            "SDL2_ttf.dll",
            "libcurl.dll",
            "zlib1.dll",
            "freetype.dll"
          )

          foreach ($dll in $dlls) {
            $source = Join-Path $vcpkgBin $dll

            if (Test-Path $source) {
              Copy-Item $source dist\
            }
          }

          if (Test-Path resources) {
            Copy-Item `
              -Recurse `
              resources `
              dist\resources
          }

          if (Test-Path resources\config.default.json) {
            Copy-Item `
              resources\config.default.json `
              dist\config.json
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\* `
            -DestinationPath calcium-client-windows-desktop.zip `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: calcium-client-windows-desktop.zip
          retention-days: 30


  # ============================================================
  # PS4 OpenOrbis build
  # ============================================================

  build-ps4:
    name: PS4 Homebrew Build
    runs-on: ubuntu-latest

    env:
      OO_VERSION: v0.5.2
      OO_ROOT: ${{ github.workspace }}/openorbis

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------------

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            llvm \
            curl \
            ca-certificates \
            git \
            unzip \
            python3 \
            python3-pip \
            jq

      - name: Verify Linux tools
        run: |
          cmake --version
          ninja --version
          clang --version
          ld.lld --version
          python3 --version

      # --------------------------------------------------------
      # Download the REAL OpenOrbis release
      #
      # Do NOT clone the source repository here.
      # OpenOrbis explicitly says the release ZIP contains
      # the binaries needed for an installation.
      # --------------------------------------------------------

      - name: Download OpenOrbis release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OO_ROOT"

          RELEASE_JSON="$(mktemp)"

          curl -fsSL \
            "https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/${OO_VERSION}" \
            -o "$RELEASE_JSON"

          DOWNLOAD_URL="$(
            jq -r '
              .assets[]
              | select(.name | test("\\.(zip|tar\\.gz)$"; "i"))
              | .browser_download_url
            ' "$RELEASE_JSON" \
            | head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find an OpenOrbis release archive."
            cat "$RELEASE_JSON"
            exit 1
          fi

          echo "Downloading:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            "$DOWNLOAD_URL" \
            -o /tmp/openorbis-release

          file /tmp/openorbis-release

      - name: Extract OpenOrbis
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OO_ROOT"
          mkdir -p "$OO_ROOT"

          case "$(file -b /tmp/openorbis-release)" in
            *Zip*)
              unzip -q \
                /tmp/openorbis-release \
                -d "$OO_ROOT"
              ;;
            *gzip*)
              tar -xzf \
                /tmp/openorbis-release \
                -C "$OO_ROOT"
              ;;
            *)
              echo "Unknown OpenOrbis archive format."
              file /tmp/openorbis-release
              exit 1
              ;;
          esac

          echo "OpenOrbis files:"
          find "$OO_ROOT" -maxdepth 3 -type f | sort | head -200

      # --------------------------------------------------------
      # Locate the actual OpenOrbis installation root.
      # --------------------------------------------------------

      - name: Locate OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="$(
            find "$OO_ROOT" \
              -type f \
              \( \
                -name "create-eboot" \
                -o -name "create-fself" \
              \) \
              -print \
              | head -n 1 \
              | xargs -r dirname \
              | xargs -r dirname
          )"

          if [ -z "$TOOLCHAIN_ROOT" ]; then
            echo "Could not locate an OpenOrbis executable."
            echo
            echo "Extracted files:"
            find "$OO_ROOT" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Detected OpenOrbis root:"
          echo "$TOOLCHAIN_ROOT"

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      - name: Verify OpenOrbis installation
        shell: bash
        run: |
          set -euo pipefail

          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"

          test -d "$OO_PS4_TOOLCHAIN"

          echo
          echo "Top-level directories:"
          find "$OO_PS4_TOOLCHAIN" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "Important OpenOrbis tools:"
          find "$OO_PS4_TOOLCHAIN/bin" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "create-eboot" \
              -o -name "create-fself" \
              -o -name "create-gp4" \
              -o -name "create-pkg" \
              -o -name "create-sfo" \
            \) \
            -print \
            | sort || true

      # --------------------------------------------------------
      # Add OpenOrbis binaries to PATH
      # --------------------------------------------------------

      - name: Configure OpenOrbis environment
        shell: bash
        run: |
          set -euo pipefail

          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN" >> "$GITHUB_ENV"

          if [ -d "$OO_PS4_TOOLCHAIN/bin" ]; then
            echo "$OO_PS4_TOOLCHAIN/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$OO_PS4_TOOLCHAIN/bin/linux" ]; then
            echo "$OO_PS4_TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"
          fi

          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -exec chmod +x {} \; \
            2>/dev/null || true

      # --------------------------------------------------------
      # Generate a CMake toolchain for Calcium.
      #
      # OpenOrbis itself does not provide the CMake file your
      # previous workflow was pointing at.
      # --------------------------------------------------------

      - name: Generate PS4 CMake toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p cmake

          cat > cmake/openorbis.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          if(NOT DEFINED ENV{OO_PS4_TOOLCHAIN})
              message(FATAL_ERROR
                  "OO_PS4_TOOLCHAIN is not set."
              )
          endif()

          set(OO_PS4_TOOLCHAIN "$ENV{OO_PS4_TOOLCHAIN}")

          find_program(
              OO_CLANG
              clang
              REQUIRED
          )

          find_program(
              OO_CLANGXX
              clang++
              REQUIRED
          )

          find_program(
              OO_LLD
              ld.lld
              REQUIRED
          )

          set(CMAKE_C_COMPILER "${OO_CLANG}")
          set(CMAKE_CXX_COMPILER "${OO_CLANGXX}")

          set(CMAKE_C_COMPILER_TARGET "x86_64-pc-freebsd")
          set(CMAKE_CXX_COMPILER_TARGET "x86_64-pc-freebsd")

          set(CMAKE_C_FLAGS_INIT
              "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_CXX_FLAGS_INIT
              "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_EXE_LINKER_FLAGS_INIT
              "-fuse-ld=lld"
          )

          set(CMAKE_SHARED_LINKER_FLAGS_INIT
              "-fuse-ld=lld"
          )

          include_directories(
              "${OO_PS4_TOOLCHAIN}/include"
          )

          link_directories(
              "${OO_PS4_TOOLCHAIN}/lib"
          )

          set(CMAKE_FIND_ROOT_PATH
              "${OO_PS4_TOOLCHAIN}"
          )

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          echo "Generated:"
          cat cmake/openorbis.cmake

      # --------------------------------------------------------
      # Configure Calcium for PS4
      # --------------------------------------------------------

      - name: Configure CMake for PS4
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-ps4 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/openorbis.cmake" \
            -DCALCIUM_PLATFORM_PS4=ON \
            -DCALCIUM_BUILD_DESKTOP=OFF \
            -DCALCIUM_BUILD_TESTS=OFF \
            -DCALCIUM_ENABLE_CURL=OFF

      - name: Build PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-ps4 \
            --parallel

      # --------------------------------------------------------
      # Locate the produced ELF.
      # --------------------------------------------------------

      - name: Locate PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "Build output:"
          find build-ps4 \
            -type f \
            -print \
            | sort

          ELF="$(
            find build-ps4 \
              -type f \
              \( \
                -name "calcium-client" \
                -o -name "calcium-client.elf" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$ELF" ]; then
            echo "Could not find Calcium PS4 ELF."
            exit 1
          fi

          echo "PS4_ELF=$ELF" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ELF"

      # --------------------------------------------------------
      # Create eboot.bin
      # --------------------------------------------------------

      - name: Create PS4 eboot.bin
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pkg_root/Image0/sce_sys

          CREATE_EBOOT="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-eboot" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_EBOOT" ]; then
            echo "OpenOrbis create-eboot was not found."
            exit 1
          fi

          chmod +x "$CREATE_EBOOT"

          "$CREATE_EBOOT" \
            "$PS4_ELF" \
            pkg_root/Image0/eboot.bin

          test -f pkg_root/Image0/eboot.bin

          file pkg_root/Image0/eboot.bin

      # --------------------------------------------------------
      # Create param.sfo
      #
      # Do not manufacture a fake 0x1000-byte SFO. A zero-filled
      # file is not a valid PS4 param.sfo.
      # --------------------------------------------------------

      - name: Create param.sfo
        shell: bash
        run: |
          set -euo pipefail

          if [ -f resources/sce_sys/param.sfo ]; then
            cp \
              resources/sce_sys/param.sfo \
              pkg_root/Image0/sce_sys/param.sfo
          else
            echo "No param.sfo found in resources/sce_sys."
            echo
            echo "OpenOrbis packaging tools can generate SFO data, but"
            echo "the exact CLI differs between toolchain releases."
            echo "Provide a valid project param.sfo instead of creating"
            echo "a fake zero-filled file."
            exit 1
          fi

          test -s pkg_root/Image0/sce_sys/param.sfo

      # --------------------------------------------------------
      # Copy application resources.
      # --------------------------------------------------------

      - name: Stage PS4 resources
        shell: bash
        run: |
          set -euo pipefail

          if [ -f resources/icons/calcium_icon0.png ]; then
            cp \
              resources/icons/calcium_icon0.png \
              pkg_root/Image0/sce_sys/icon0.png
          fi

          if [ -d resources/themes ]; then
            cp -r \
              resources/themes \
              pkg_root/Image0/themes
          fi

          if [ -d resources/mock_repo ]; then
            cp -r \
              resources/mock_repo \
              pkg_root/Image0/mock_repo
          fi

          if [ -f resources/config.default.json ]; then
            cp \
              resources/config.default.json \
              pkg_root/Image0/config.json
          fi

      # --------------------------------------------------------
      # Find a package creation tool.
      # --------------------------------------------------------

      - name: Locate package tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Available packaging tools:"
          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            | grep -Ei \
              'pkg|gp4|sfo|eboot|fself' \
            | sort || true

      # --------------------------------------------------------
      # Build PKG.
      #
      # The release versions of LibOrbisPkg / package tooling can
      # differ in CLI syntax, so first detect what is actually
      # installed rather than pretending PkgTool.Core is a Linux
      # executable with a fixed interface.
      # --------------------------------------------------------

      - name: Build PS4 PKG
        shell: bash
        run: |
          set -euo pipefail

          CREATE_PKG="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              \( \
                -name "create-pkg" \
                -o -name "create-gp4" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_PKG" ]; then
            echo "No create-pkg/create-gp4 executable was found."
            echo
            echo "OpenOrbis toolchain contents:"
            find "$OO_PS4_TOOLCHAIN/bin" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          chmod +x "$CREATE_PKG"

          echo "Using:"
          echo "$CREATE_PKG"

          "$CREATE_PKG" --help || true

          echo
          echo "The ELF and eboot were successfully built."
          echo "Package creation tool detected:"
          echo "$CREATE_PKG"

      # --------------------------------------------------------
      # Upload the PS4 build directory as an artifact.
      #
      # This guarantees you get the compiled output even if the
      # packaging CLI changes between OpenOrbis releases.
      # --------------------------------------------------------

      - name: Upload PS4 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: |
            build-ps4/
            pkg_root/
            cmake/openorbis.cmake
          retention-days: 30


  # ============================================================
  # GitHub Release
  # ============================================================

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-desktop
      - build-ps4

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: release/

      - name: Download PS4 artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: release/ps4/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Calcium Client ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

          body: |
            ## Calcium Client ${{ github.ref_name }}

            ### Downloads

            `calcium-client-windows-desktop.zip`

            Windows desktop build.

            The PS4 artifact contains the OpenOrbis build output and
            staged package filesystem.

            ### Builds

            - Windows desktop
            - PS4 OpenOrbis homebrew build

          files: |
            release/calcium-client-windows-desktop.zip
