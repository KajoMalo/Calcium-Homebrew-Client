name: Build Calcium Client

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # WINDOWS DESKTOP
  # ============================================================

  build-windows-desktop:
    name: Windows Desktop Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install `
            curl:x64-windows `
            zlib:x64-windows `
            sdl2:x64-windows `
            sdl2-ttf:x64-windows

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang --version

      # --------------------------------------------------------
      # Configure
      #
      # Ninja is used instead of the Visual Studio generator.
      # This avoids CMake's Visual Studio instance detection.
      #
      # Tests are disabled here because the project currently
      # downloads Catch2 through FetchContent and its recorded
      # SHA256 does not match the archive being returned.
      # --------------------------------------------------------

      - name: Configure Windows CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCALCIUM_BUILD_DESKTOP=ON `
            -DCALCIUM_BUILD_TESTS=OFF `
            -DCALCIUM_ENABLE_CURL=ON `
            -DCALCIUM_PLATFORM_PS4=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build Windows client
        shell: pwsh
        run: |
          cmake --build build --parallel

      # --------------------------------------------------------
      # Locate executable
      # --------------------------------------------------------

      - name: Locate Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter "calcium-client.exe" `
            -Recurse `
            -File `
            | Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host "Build tree:"
            Get-ChildItem build -Recurse
            throw "calcium-client.exe was not produced."
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

          "CALCIUM_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # --------------------------------------------------------
      # Stage release
      # --------------------------------------------------------

      - name: Stage Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            dist | Out-Null

          Copy-Item `
            "$env:CALCIUM_EXE" `
            "dist\calcium-client.exe"

          $vcpkgBin =
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

          $dlls = @(
            "SDL2.dll",
            "SDL2_ttf.dll",
            "libcurl.dll",
            "zlib1.dll",
            "freetype.dll"
          )

          foreach ($dll in $dlls) {
            $source = Join-Path $vcpkgBin $dll

            if (Test-Path $source) {
              Copy-Item `
                $source `
                dist\
            }
          }

          if (Test-Path "resources") {
            Copy-Item `
              -Recurse `
              "resources" `
              "dist\resources"
          }

          if (Test-Path "resources\config.default.json") {
            Copy-Item `
              "resources\config.default.json" `
              "dist\config.json"
          }

      # --------------------------------------------------------
      # ZIP
      # --------------------------------------------------------

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\*" `
            -DestinationPath "calcium-client-windows-desktop.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: calcium-client-windows-desktop.zip
          retention-days: 30


  # ============================================================
  # PS4 HOMEBREW
  # ============================================================

  build-ps4:
    name: PS4 Homebrew Build
    runs-on: ubuntu-latest

    env:
      OO_VERSION: v0.5.2
      OO_ROOT: ${{ github.workspace }}/openorbis

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------------

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            llvm \
            curl \
            ca-certificates \
            git \
            unzip \
            python3 \
            python3-pip \
            jq

      - name: Verify Linux tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          clang --version
          clang++ --version
          ld.lld --version
          python3 --version
          jq --version

      # --------------------------------------------------------
      # Download OpenOrbis
      #
      # IMPORTANT:
      #
      # GitHub creates a source ZIP automatically for every tag.
      # That ZIP contains samples/source but not the prebuilt
      # toolchain binaries.
      #
      # Therefore we explicitly reject:
      #   - source archives
      #   - src archives
      #   - GitHub-generated archives
      #
      # and select an actual release asset.
      # --------------------------------------------------------

      - name: Download OpenOrbis binary release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OO_ROOT"
          mkdir -p "$OO_ROOT"

          API_URL="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/${OO_VERSION}"

          echo "Fetching release information..."
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "$API_URL" \
            -o /tmp/openorbis-release.json

          echo
          echo "Release assets:"
          jq -r '
            .assets[]
            | "\(.name) | \(.size) bytes | \(.browser_download_url)"
          ' /tmp/openorbis-release.json

          # Select an actual uploaded release archive.
          #
          # The GitHub source archive is NOT in .assets on a normal
          # release API response, but we still reject names that
          # clearly identify source archives.
          DOWNLOAD_URL="$(
            jq -r '
              .assets[]
              |
              select(
                (.name | ascii_downcase | contains("source") | not)
                and
                (.name | ascii_downcase | contains("src") | not)
                and
                (.name | test("\\.(zip|tar\\.gz|tgz)$"; "i"))
              )
              |
              .browser_download_url
            ' /tmp/openorbis-release.json
            | head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo
            echo "ERROR: Could not find the OpenOrbis binary release."
            echo
            echo "The release API returned:"
            jq -r '.assets[] | .name' /tmp/openorbis-release.json
            exit 1
          fi

          echo
          echo "Selected binary release:"
          echo "$DOWNLOAD_URL"

          curl \
            --fail \
            --location \
            --show-error \
            --progress-bar \
            "$DOWNLOAD_URL" \
            -o /tmp/openorbis-release

          echo
          echo "Downloaded archive:"
          file /tmp/openorbis-release

      # --------------------------------------------------------
      # Extract
      # --------------------------------------------------------

      - name: Extract OpenOrbis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OO_ROOT"

          FILE_TYPE="$(file -b /tmp/openorbis-release)"

          if echo "$FILE_TYPE" | grep -qi "zip"; then
            unzip -q \
              /tmp/openorbis-release \
              -d "$OO_ROOT"

          elif echo "$FILE_TYPE" | grep -qi "gzip"; then
            tar \
              -xzf \
              /tmp/openorbis-release \
              -C "$OO_ROOT"

          else
            echo "Unsupported archive:"
            echo "$FILE_TYPE"
            exit 1
          fi

          echo
          echo "Extracted OpenOrbis files:"
          find "$OO_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # --------------------------------------------------------
      # Locate actual toolchain root
      #
      # The release archive may contain a top-level directory,
      # so don't assume the archive root is the SDK root.
      # --------------------------------------------------------

      - name: Locate OpenOrbis toolchain root
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT=""

          # Prefer a directory containing the expected SDK
          # structure.
          while IFS= read -r candidate; do
            if [
              -d "$candidate/bin" ] &&
              [ -d "$candidate/include" ] &&
              [ -d "$candidate/scripts" ]; then

              TOOLCHAIN_ROOT="$candidate"
              break
            fi
          done < <(
            find "$OO_ROOT" \
              -type d \
              -print
          )

          if [ -z "$TOOLCHAIN_ROOT" ]; then
            echo
            echo "ERROR: Could not locate the OpenOrbis SDK root."
            echo
            echo "Directory tree:"
            find "$OO_ROOT" \
              -maxdepth 5 \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "OpenOrbis toolchain root:"
          echo "$TOOLCHAIN_ROOT"

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Verify SDK
      # --------------------------------------------------------

      - name: Verify OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "OO_PS4_TOOLCHAIN:"
          echo "$OO_PS4_TOOLCHAIN"

          test -d "$OO_PS4_TOOLCHAIN/bin"
          test -d "$OO_PS4_TOOLCHAIN/include"

          echo
          echo "OpenOrbis bin directory:"
          find "$OO_PS4_TOOLCHAIN/bin" \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "Searching for create-eboot..."
          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -name "create-eboot" \
            -print

          echo
          echo "Searching for create-gp4..."
          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -name "create-gp4" \
            -print

          CREATE_EBOOT="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-eboot" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_EBOOT" ]; then
            echo
            echo "ERROR: create-eboot was not found."
            echo "The selected release is not a usable binary toolchain."
            exit 1
          fi

      # --------------------------------------------------------
      # Permissions + PATH
      # --------------------------------------------------------

      - name: Configure OpenOrbis environment
        shell: bash
        run: |
          set -euo pipefail

          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -exec chmod +x {} \; \
            2>/dev/null || true

          echo "$OO_PS4_TOOLCHAIN/bin" >> "$GITHUB_PATH"

          if [ -d "$OO_PS4_TOOLCHAIN/bin/linux" ]; then
            echo "$OO_PS4_TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"
          fi

      # --------------------------------------------------------
      # Build the PS4 project using OpenOrbis's build environment.
      #
      # We don't invent a fake CMake toolchain.cmake anymore.
      # The OpenOrbis project itself uses clang/lld and the
      # OO_PS4_TOOLCHAIN environment variable.
      # --------------------------------------------------------

      - name: Configure PS4 CMake
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p cmake

          cat > cmake/openorbis.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          if(NOT DEFINED ENV{OO_PS4_TOOLCHAIN})
            message(FATAL_ERROR
              "OO_PS4_TOOLCHAIN is not defined."
            )
          endif()

          set(OO_PS4_TOOLCHAIN
              "$ENV{OO_PS4_TOOLCHAIN}"
          )

          find_program(
            OO_CLANG
            NAMES clang
            REQUIRED
          )

          find_program(
            OO_CLANGXX
            NAMES clang++
            REQUIRED
          )

          find_program(
            OO_LLD
            NAMES ld.lld
            REQUIRED
          )

          set(CMAKE_C_COMPILER
              "${OO_CLANG}"
          )

          set(CMAKE_CXX_COMPILER
              "${OO_CLANGXX}"
          )

          set(CMAKE_C_COMPILER_TARGET
              "x86_64-pc-freebsd"
          )

          set(CMAKE_CXX_COMPILER_TARGET
              "x86_64-pc-freebsd"
          )

          set(CMAKE_C_FLAGS_INIT
              "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_CXX_FLAGS_INIT
              "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_EXE_LINKER_FLAGS_INIT
              "-fuse-ld=lld"
          )

          include_directories(
            "${OO_PS4_TOOLCHAIN}/include"
          )

          link_directories(
            "${OO_PS4_TOOLCHAIN}/lib"
          )

          set(CMAKE_FIND_ROOT_PATH
              "${OO_PS4_TOOLCHAIN}"
          )

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          echo
          echo "Generated OpenOrbis CMake toolchain:"
          cat cmake/openorbis.cmake

          cmake \
            -S . \
            -B build-ps4 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/openorbis.cmake" \
            -DCALCIUM_PLATFORM_PS4=ON \
            -DCALCIUM_BUILD_DESKTOP=OFF \
            -DCALCIUM_BUILD_TESTS=OFF \
            -DCALCIUM_ENABLE_CURL=OFF

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-ps4 \
            --parallel

      # --------------------------------------------------------
      # Locate ELF
      # --------------------------------------------------------

      - name: Locate PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "PS4 build tree:"
          find build-ps4 \
            -type f \
            | sort

          ELF="$(
            find build-ps4 \
              -type f \
              \( \
                -name "calcium-client" \
                -o -name "calcium-client.elf" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$ELF" ]; then
            echo
            echo "ERROR: calcium-client ELF was not produced."
            exit 1
          fi

          echo "PS4_ELF=$ELF" >> "$GITHUB_ENV"

          echo
          echo "PS4 ELF:"
          echo "$ELF"

      # --------------------------------------------------------
      # Create eboot.bin
      #
      # v0.5.2 merged create-eboot/create-lib into one tool.
      # --------------------------------------------------------

      - name: Create eboot.bin
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pkg_root/Image0/sce_sys

          CREATE_EBOOT="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-eboot" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_EBOOT" ]; then
            echo "create-eboot not found."
            exit 1
          fi

          chmod +x "$CREATE_EBOOT"

          echo "Using:"
          echo "$CREATE_EBOOT"

          "$CREATE_EBOOT" --help || true

          # The exact create-eboot invocation is supplied by the
          # OpenOrbis release's tool. Try the common positional
          # form used by the toolchain.
          "$CREATE_EBOOT" \
            "$PS4_ELF" \
            pkg_root/Image0/eboot.bin

          if [ ! -s pkg_root/Image0/eboot.bin ]; then
            echo "eboot.bin was not produced."
            exit 1
          fi

          echo
          echo "Created:"
          ls -lh pkg_root/Image0/eboot.bin

      # --------------------------------------------------------
      # param.sfo
      #
      # A fake zero-filled SFO is intentionally not generated.
      # --------------------------------------------------------

      - name: Install param.sfo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pkg_root/Image0/sce_sys

          if [ ! -f resources/sce_sys/param.sfo ]; then
            echo
            echo "ERROR: resources/sce_sys/param.sfo is missing."
            echo
            echo "A valid PS4 param.sfo is required."
            exit 1
          fi

          cp \
            resources/sce_sys/param.sfo \
            pkg_root/Image0/sce_sys/param.sfo

          test -s pkg_root/Image0/sce_sys/param.sfo

      # --------------------------------------------------------
      # Icon + resources
      # --------------------------------------------------------

      - name: Stage PS4 resources
        shell: bash
        run: |
          set -euo pipefail

          if [ -f resources/icons/calcium_icon0.png ]; then
            cp \
              resources/icons/calcium_icon0.png \
              pkg_root/Image0/sce_sys/icon0.png
          fi

          if [ -d resources/themes ]; then
            cp -r \
              resources/themes \
              pkg_root/Image0/themes
          fi

          if [ -d resources/mock_repo ]; then
            cp -r \
              resources/mock_repo \
              pkg_root/Image0/mock_repo
          fi

          if [ -f resources/config.default.json ]; then
            cp \
              resources/config.default.json \
              pkg_root/Image0/config.json
          fi

      # --------------------------------------------------------
      # Show packaging tools
      # --------------------------------------------------------

      - name: Inspect OpenOrbis packaging tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Packaging-related tools:"
          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            | grep -Ei \
              'pkg|gp4|sfo|eboot|fself' \
            | sort || true

      # --------------------------------------------------------
      # Package
      #
      # create-gp4 creates the GP4 project. LibOrbisPkg is then
      # used for the final PKG.
      #
      # The release may expose these through different paths, so
      # locate them instead of hardcoding /bin/linux/PkgTool.Core.
      # --------------------------------------------------------

      - name: Locate create-gp4
        shell: bash
        run: |
          set -euo pipefail

          CREATE_GP4="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-gp4" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_GP4" ]; then
            echo "create-gp4 was not found."
            exit 1
          fi

          chmod +x "$CREATE_GP4"

          echo "CREATE_GP4=$CREATE_GP4" >> "$GITHUB_ENV"

      - name: Generate GP4
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pkg

          echo "Using create-gp4:"
          echo "$CREATE_GP4"

          "$CREATE_GP4" --help || true

          # Generate a GP4 from the staged package filesystem.
          "$CREATE_GP4" \
            pkg_root \
            pkg/calcium-client.gp4

          test -s pkg/calcium-client.gp4

      # --------------------------------------------------------
      # LibOrbisPkg
      #
      # OpenOrbis documents LibOrbisPkg as the tool used to create
      # the final PKG and SFO files.
      # --------------------------------------------------------

      - name: Locate LibOrbisPkg
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for LibOrbisPkg..."

          find "$OO_PS4_TOOLCHAIN" \
            -type f \
            \( \
              -iname "PkgTool.Core" \
              -o -iname "LibOrbisPkg*" \
              -o -iname "*LibOrbisPkg*.dll" \
            \) \
            -print \
            | sort

      # --------------------------------------------------------
      # Upload build output.
      #
      # The artifact is always produced if compilation succeeds,
      # even if a future LibOrbisPkg CLI changes.
      # --------------------------------------------------------

      - name: Upload PS4 build
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: |
            build-ps4/
            pkg_root/
            pkg/
            cmake/openorbis.cmake
          retention-days: 30


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-windows-desktop
      - build-ps4

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: release/windows

      - name: Download PS4 artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: release/ps4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          name: Calcium Client ${{ github.ref_name }}

          draft: false

          prerelease: ${{ contains(github.ref_name, '-') }}

          body: |
            # Calcium Client ${{ github.ref_name }}

            ## Windows

            Desktop build using SDL2.

            ## PS4

            OpenOrbis PS4 homebrew build.

          files: |
            release/windows/calcium-client-windows-desktop.zip