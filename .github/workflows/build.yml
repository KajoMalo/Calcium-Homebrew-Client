name: Build Calcium Client

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # WINDOWS DESKTOP BUILD
  # ============================================================

  build-windows-desktop:
    name: Windows Desktop Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install `
            curl:x64-windows `
            zlib:x64-windows `
            sdl2:x64-windows `
            sdl2-ttf:x64-windows

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang --version

      # Catch2 is currently fetched by the project when tests are
      # enabled. Tests are disabled for the release build so the
      # stale Catch2 SHA256 cannot break the desktop build.

      - name: Configure Windows
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCALCIUM_BUILD_DESKTOP=ON `
            -DCALCIUM_BUILD_TESTS=OFF `
            -DCALCIUM_ENABLE_CURL=ON `
            -DCALCIUM_PLATFORM_PS4=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Windows
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter "calcium-client.exe" `
            -Recurse `
            -File `
            | Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host "Build contents:"
            Get-ChildItem build -Recurse
            throw "calcium-client.exe was not produced."
          }

          Write-Host "Found $($exe.FullName)"
          "CALCIUM_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Stage Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            dist | Out-Null

          Copy-Item `
            "$env:CALCIUM_EXE" `
            "dist\calcium-client.exe"

          $vcpkgBin =
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

          $dlls = @(
            "SDL2.dll",
            "SDL2_ttf.dll",
            "libcurl.dll",
            "zlib1.dll",
            "freetype.dll"
          )

          foreach ($dll in $dlls) {
            $source = Join-Path $vcpkgBin $dll

            if (Test-Path $source) {
              Copy-Item $source dist\
            }
          }

          if (Test-Path resources) {
            Copy-Item `
              -Recurse `
              resources `
              dist\resources
          }

          if (Test-Path resources\config.default.json) {
            Copy-Item `
              resources\config.default.json `
              dist\config.json
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\*" `
            -DestinationPath "calcium-client-windows-desktop.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: calcium-client-windows-desktop.zip
          retention-days: 30


  # ============================================================
  # OPENORBIS TOOLCHAIN
  # ============================================================

  build-ps4:
    name: PS4 Homebrew Build
    runs-on: ubuntu-latest

    env:
      OO_VERSION: v0.5.2
      OO_ROOT: ${{ github.workspace }}/openorbis

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------------

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            clang++ \
            lld \
            llvm \
            make \
            gcc \
            g++ \
            curl \
            ca-certificates \
            git \
            unzip \
            tar \
            python3 \
            python3-pip \
            python3-venv

      - name: Verify Linux tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          clang --version
          clang++ --version
          ld.lld --version
          python3 --version

      # --------------------------------------------------------
      # Download OpenOrbis source release.
      #
      # v0.5.2 does not provide a Linux binary release asset.
      # The official documentation says Linux users install
      # clang/lld separately and use the toolchain source tree.
      # --------------------------------------------------------

      - name: Download OpenOrbis v0.5.2
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OO_ROOT"

          mkdir -p "$OO_ROOT"

          curl \
            --fail \
            --location \
            --show-error \
            --progress-bar \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_VERSION}/v0.5.2.tar.gz" \
            -o /tmp/openorbis.tar.gz

          file /tmp/openorbis.tar.gz

      # --------------------------------------------------------
      # Extract source.
      # --------------------------------------------------------

      - name: Extract OpenOrbis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OO_ROOT"

          tar \
            -xzf \
            /tmp/openorbis.tar.gz \
            -C "$OO_ROOT" \
            --strip-components=1

          echo "OpenOrbis source tree:"
          find "$OO_ROOT" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "Important files:"
          find "$OO_ROOT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------

      - name: Configure OpenOrbis environment
        shell: bash
        run: |
          set -euo pipefail

          echo "OO_PS4_TOOLCHAIN=$OO_ROOT" >> "$GITHUB_ENV"

          echo "$OO_ROOT/bin" >> "$GITHUB_PATH"

          if [ -d "$OO_ROOT/bin/linux" ]; then
            echo "$OO_ROOT/bin/linux" >> "$GITHUB_PATH"
          fi

      # --------------------------------------------------------
      # Build OpenOrbis toolchain
      #
      # The source repository contains the build scripts.
      # We locate the relevant Linux build script rather than
      # assuming an undocumented filename.
      # --------------------------------------------------------

      - name: Inspect OpenOrbis build scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "Available build/setup scripts:"

          find "$OO_ROOT" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.sh" \
              -o -name "*.py" \
              -o -name "Makefile" \
            \) \
            | sort

      - name: Build OpenOrbis dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$OO_ROOT"

          # OpenOrbis provides setup-project/build scripts under
          # extra/. Run the Linux toolchain setup if present.

          if [ -f "extra/setup-toolchain.sh" ]; then
            chmod +x extra/setup-toolchain.sh
            ./extra/setup-toolchain.sh
          elif [ -f "extra/setup-linux.sh" ]; then
            chmod +x extra/setup-linux.sh
            ./extra/setup-linux.sh
          elif [ -f "scripts/build.sh" ]; then
            chmod +x scripts/build.sh
            ./scripts/build.sh
          else
            echo "No known Linux toolchain build script was found."
            echo
            echo "Available scripts:"
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.sh" \
              -print \
              | sort

            echo
            echo "Available Makefiles:"
            find . \
              -maxdepth 4 \
              -type f \
              -name "Makefile" \
              -print \
              | sort

            exit 1
          fi

      # --------------------------------------------------------
      # Verify toolchain.
      # --------------------------------------------------------

      - name: Verify OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "OO_PS4_TOOLCHAIN:"
          echo "$OO_PS4_TOOLCHAIN"

          test -d "$OO_PS4_TOOLCHAIN/include"

          echo
          echo "OpenOrbis binaries:"

          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "Searching for create-eboot..."

          CREATE_EBOOT="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-eboot" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_EBOOT" ]; then
            echo
            echo "ERROR:"
            echo "create-eboot was not produced by the OpenOrbis build."
            echo
            echo "This means the toolchain build did not complete."
            exit 1
          fi

          echo "Found:"
          echo "$CREATE_EBOOT"

      - name: Add OpenOrbis binaries to PATH
        shell: bash
        run: |
          set -euo pipefail

          find "$OO_PS4_TOOLCHAIN/bin" \
            -type f \
            -exec chmod +x {} \; \
            2>/dev/null || true

          echo "$OO_PS4_TOOLCHAIN/bin" >> "$GITHUB_PATH"

          if [ -d "$OO_PS4_TOOLCHAIN/bin/linux" ]; then
            echo "$OO_PS4_TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"
          fi

      # ========================================================
      # CALCIUM PS4 BUILD
      # ========================================================

      - name: Generate OpenOrbis CMake toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p cmake

          cat > cmake/openorbis.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          if(NOT DEFINED ENV{OO_PS4_TOOLCHAIN})
            message(FATAL_ERROR
              "OO_PS4_TOOLCHAIN is not set."
            )
          endif()

          set(OO_PS4_TOOLCHAIN
            "$ENV{OO_PS4_TOOLCHAIN}"
          )

          find_program(
            OO_CLANG
            NAMES clang
            REQUIRED
          )

          find_program(
            OO_CLANGXX
            NAMES clang++
            REQUIRED
          )

          set(CMAKE_C_COMPILER
            "${OO_CLANG}"
          )

          set(CMAKE_CXX_COMPILER
            "${OO_CLANGXX}"
          )

          set(CMAKE_C_COMPILER_TARGET
            "x86_64-pc-freebsd"
          )

          set(CMAKE_CXX_COMPILER_TARGET
            "x86_64-pc-freebsd"
          )

          set(CMAKE_C_FLAGS_INIT
            "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_CXX_FLAGS_INIT
            "--target=x86_64-pc-freebsd"
          )

          set(CMAKE_EXE_LINKER_FLAGS_INIT
            "-fuse-ld=lld"
          )

          set(CMAKE_CXX_STANDARD 17)

          include_directories(
            "${OO_PS4_TOOLCHAIN}/include"
          )

          link_directories(
            "${OO_PS4_TOOLCHAIN}/lib"
          )

          set(CMAKE_FIND_ROOT_PATH
            "${OO_PS4_TOOLCHAIN}"
          )

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          cat cmake/openorbis.cmake

      - name: Configure Calcium PS4
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-ps4 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/openorbis.cmake" \
            -DCALCIUM_PLATFORM_PS4=ON \
            -DCALCIUM_BUILD_DESKTOP=OFF \
            -DCALCIUM_BUILD_TESTS=OFF \
            -DCALCIUM_ENABLE_CURL=OFF

      - name: Build Calcium PS4
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-ps4 \
            --parallel

      # --------------------------------------------------------
      # Locate ELF.
      # --------------------------------------------------------

      - name: Locate PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "Build output:"
          find build-ps4 \
            -type f \
            | sort

          ELF="$(
            find build-ps4 \
              -type f \
              \( \
                -name "calcium-client" \
                -o -name "calcium-client.elf" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$ELF" ]; then
            echo "ERROR: Calcium PS4 ELF was not produced."
            exit 1
          fi

          echo "PS4_ELF=$ELF" >> "$GITHUB_ENV"

          echo "Found PS4 ELF:"
          echo "$ELF"

      # --------------------------------------------------------
      # Create package filesystem.
      # --------------------------------------------------------

      - name: Create PS4 package filesystem
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            pkg_root/Image0/sce_sys

          CREATE_EBOOT="$(
            find "$OO_PS4_TOOLCHAIN/bin" \
              -type f \
              -name "create-eboot" \
              -print \
              | head -n 1
          )"

          if [ -z "$CREATE_EBOOT" ]; then
            echo "create-eboot not found."
            exit 1
          fi

          chmod +x "$CREATE_EBOOT"

          echo "create-eboot:"
          echo "$CREATE_EBOOT"

          "$CREATE_EBOOT" \
            "$PS4_ELF" \
            pkg_root/Image0/eboot.bin

          test -s \
            pkg_root/Image0/eboot.bin

      # --------------------------------------------------------
      # Valid param.sfo required.
      # --------------------------------------------------------

      - name: Install param.sfo
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f resources/sce_sys/param.sfo ]; then
            echo "ERROR: resources/sce_sys/param.sfo is missing."
            exit 1
          fi

          cp \
            resources/sce_sys/param.sfo \
            pkg_root/Image0/sce_sys/param.sfo

          test -s \
            pkg_root/Image0/sce_sys/param.sfo

      - name: Stage PS4 resources
        shell: bash
        run: |
          set -euo pipefail

          if [ -f resources/icons/calcium_icon0.png ]; then
            cp \
              resources/icons/calcium_icon0.png \
              pkg_root/Image0/sce_sys/icon0.png
          fi

          if [ -d resources/themes ]; then
            cp -r \
              resources/themes \
              pkg_root/Image0/themes
          fi

          if [ -d resources/mock_repo ]; then
            cp -r \
              resources/mock_repo \
              pkg_root/Image0/mock_repo
          fi

          if [ -f resources/config.default.json ]; then
            cp \
              resources/config.default.json \
              pkg_root/Image0/config.json
          fi

      # --------------------------------------------------------
      # Upload compiled PS4 build.
      # --------------------------------------------------------

      - name: Upload PS4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: |
            build-ps4/
            pkg_root/
            cmake/openorbis.cmake
          retention-days: 30


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-windows-desktop
      - build-ps4

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-windows-desktop
          path: release/windows

      - name: Download PS4 artifact
        uses: actions/download-artifact@v4
        with:
          name: calcium-client-ps4-build
          path: release/ps4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          name: Calcium Client ${{ github.ref_name }}

          draft: false

          prerelease: ${{ contains(github.ref_name, '-') }}

          body: |
            # Calcium Client ${{ github.ref_name }}

            ## Windows

            Windows desktop build.

            ## PS4

            OpenOrbis PS4 homebrew build.

          files: |
            release/windows/calcium-client-windows-desktop.zip